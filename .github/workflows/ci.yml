name: HELIOS CI
run-name: ${{ inputs.check_id || 'HELIOS CI' }}

on:
  push:
    branches: [ main, master, devel ]
  pull_request:
    branches: [ main, master, devel ]
  workflow_dispatch:
    inputs:
      check_id:
        description: Unique identifier used by local CI checker
        required: false
        type: string
      python_version:
        description: Python version from .github/ci-contract.json, or all
        default: all
        type: string

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.matrix.outputs.test-matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          PYTHON_SELECTION: ${{ inputs.python_version || 'all' }}
        run: |
          echo "test-matrix=$(python3 scripts/ci_contract.py matrix --python-version "$PYTHON_SELECTION")" >> "$GITHUB_OUTPUT"

  build-test:
    needs: configure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.test-matrix) }}

    steps:
      - name: Checkout HELIOS repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package and Dev Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e '.[dev,dashboard]'

      - name: Verify Core Package Import Boundaries
        run: |
          python -c "import helios; print('HELIOS core imported successfully')"

      - name: Verify CLI Entrypoints
        run: |
          helios --help
          helios tune-orbit --help
          helios chat --help
          helios dashboard --help

      - name: Shared Hygiene and Contract Checks
        run: python scripts/ci_contract.py checks

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ --tb=short -v

  package-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel package
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel --outdir dist/

      - name: Verify isolated wheel installation
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install $(find dist/ -name "*.whl")
          python -c "import helios; print('Installed HELIOS wheel successfully')"
          helios --help
