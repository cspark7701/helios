[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-linac"
version = "0.1.0"
description = "HELIOS: HEavy ion Linac Intelligent Orchestration - Agentic AI Framework for Accelerator Control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chong Shik Park", email = "cspark7701@gmail.com" },
    { name = "HELIOS Team" }
]
keywords = [
    "particle accelerator",
    "heavy ion linac",
    "agentic AI",
    "EPICS",
    "beam physics",
    "digital twin",
    "autonomous control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "typing_extensions>=4.8.0",
]

[project.optional-dependencies]
epics = [
    "pyepics>=3.5.0",
    "p4p>=4.3.0",
]
ml = [
    "torch>=2.0.0",
]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
]
ontology = [
    "linkml>=1.7.0",
    "linkml-runtime>=1.7.0",
    "rdflib>=7.0.0",
]
rl = [
    "gymnasium>=0.28.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "httpx2>=2.13.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "pyepics>=3.5.0",
    "p4p>=4.3.0",
    "torch>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "linkml>=1.7.0",
    "linkml-runtime>=1.7.0",
    "rdflib>=7.0.0",
    "gymnasium>=0.28.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "httpx2>=2.13.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
helios = "helios.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["helios*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --cov=helios --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["helios"]
omit = [
    "helios/cli/main.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
